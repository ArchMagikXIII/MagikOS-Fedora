# Session-wide Magikos install root. uwsm sessions receive this through
# /usr/share/uwsm/env.d/10-magikos; this fragment covers session managers
# that only read environment.d (gdm-wayland-session on Fedora has no uwsm
# and never sources profile.d). Dev link/unlink overrides live in
# /etc/magikos.conf and reach shells through default/bash/env-bootstrap.
MAGIKOS_PATH=/usr/share/magikos
